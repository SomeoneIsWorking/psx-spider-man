name: Asset-free native runtime contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: Linux x86-64 native/Lightrec product
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Check out Spider with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.12"
      - name: Create the locked Python environment
        run: uv sync --frozen
      - name: Resolve psxport
        run: uv run --no-project https://raw.githubusercontent.com/SomeoneIsWorking/psxport/main/tools/psxport_fetch.py --auto
      - name: Provision the shared pinned Linux build inputs
        uses: ./external/psxport/.github/actions/setup-linux
        with:
          framework-directory: external/psxport
      - name: Verify the real asset-free consumer boundary
        run: uv run --frozen python tools/verify.py
